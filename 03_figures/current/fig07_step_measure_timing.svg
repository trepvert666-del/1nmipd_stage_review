<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1620" viewBox="0 0 1600 1080"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#176A9B"/></marker><marker id="vecarrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#176A9B"/></marker></defs><rect width="1600" height="1080" fill="white"/><text x="70" y="79" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="38" fill="#17364B" font-weight="700" text-anchor="start">图7  Step-and-Measure的真实动作顺序与时间边界</text><text x="70" y="125" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="22" fill="#5B6C78" font-weight="400" text-anchor="start">执行AF的帧：当前按串行预算；未知耗时必须另计，重叠执行需有实测依据</text><line x1="70" y1="154" x2="1530" y2="154" stroke="#CBD6DE" stroke-width="2"/><rect x="70" y="191" width="306" height="42" rx="21" fill="#F2F6F9" stroke="#F2F6F9" stroke-width="2"/><text x="223.0" y="220" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="20" fill="#176A9B" font-weight="600" text-anchor="middle">实线色块：已知时间分配</text><rect x="395" y="191" width="360" height="42" rx="21" fill="#FFF3E8" stroke="#FFF3E8" stroke-width="2"/><text x="575.0" y="220" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="20" fill="#C66C25" font-weight="600" text-anchor="middle">虚线区域：耗时未知，图宽不计时</text><rect x="120" y="340" width="180" height="150" rx="8" fill="#FFF3E8" stroke="#C66C25" stroke-width="2" stroke-dasharray="8 6"/><path d="M201.0,499 l8,-12 l8,12 l8,-12" fill="none" stroke="#C66C25" stroke-width="2.5"/><rect x="300" y="340" width="420" height="150" rx="8" fill="#176A9B" stroke="white" stroke-width="2"/><rect x="720" y="340" width="280" height="150" rx="8" fill="#197D85" stroke="white" stroke-width="2"/><rect x="1000" y="340" width="200" height="150" rx="8" fill="#FFF3E8" stroke="#C66C25" stroke-width="2" stroke-dasharray="8 6"/><path d="M1091.0,499 l8,-12 l8,12 l8,-12" fill="none" stroke="#C66C25" stroke-width="2.5"/><rect x="1200" y="340" width="84" height="150" rx="8" fill="#608DA8" stroke="white" stroke-width="2"/><rect x="1284" y="340" width="150" height="150" rx="8" fill="#FFF3E8" stroke="#C66C25" stroke-width="2" stroke-dasharray="8 6"/><path d="M1350.0,499 l8,-12 l8,12 l8,-12" fill="none" stroke="#C66C25" stroke-width="2.5"/><text x="210" y="392" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="24" fill="#C66C25" font-weight="600" text-anchor="middle">XY移动</text><text x="210" y="434" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="24" fill="#C66C25" font-weight="600" text-anchor="middle">时间另计</text><text x="510" y="394" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="30" fill="white" font-weight="700" text-anchor="middle">XY稳定</text><text x="510" y="444" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="30" fill="white" font-weight="700" text-anchor="middle">150 ms</text><text x="860" y="381" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="25" fill="white" font-weight="600" text-anchor="middle">自动对焦 AF</text><text x="860" y="422" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="25" fill="white" font-weight="600" text-anchor="middle">100 ms</text><text x="860" y="463" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="25" fill="white" font-weight="600" text-anchor="middle">按策略执行</text><text x="1100" y="374" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="19" fill="#C66C25" font-weight="600" text-anchor="middle">AF后恢复</text><text x="1100" y="404" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="19" fill="#C66C25" font-weight="600" text-anchor="middle">Measurement</text><text x="1100" y="434" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="19" fill="#C66C25" font-weight="600" text-anchor="middle">Ready等待</text><text x="1100" y="464" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="19" fill="#C66C25" font-weight="600" text-anchor="middle">时间另计</text><text x="1242" y="410" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="26" fill="white" font-weight="700" text-anchor="middle">30</text><text x="1242" y="446" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="19" fill="white" font-weight="400" text-anchor="middle">ms</text><text x="1359" y="393" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="20" fill="#C66C25" font-weight="600" text-anchor="middle">未包含的读出</text><text x="1359" y="433" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="20" fill="#C66C25" font-weight="600" text-anchor="middle">时间另计</text><text x="1219" y="279" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="25" fill="#17364B" font-weight="600" text-anchor="middle">曝光 / 采集</text><line x1="1219" y1="292" x2="1242" y2="330" stroke="#176A9B" stroke-width="2"/><line x1="120" y1="532" x2="1434" y2="532" stroke="#176A9B" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1458" y="540" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="21" fill="#176A9B" font-weight="400" text-anchor="start">顺序</text><text x="300" y="571" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="21" fill="#5B6C78" font-weight="400" text-anchor="start">已知时长三段按同一比例绘制；未知段采用断轴示意，不能由图宽读取总周期。</text><rect x="120" y="611" width="1314" height="89" rx="12" fill="#F2F6F9" stroke="#CBD6DE" stroke-width="2"/><line x1="155" y1="654" x2="1400" y2="654" stroke="#176A9B" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="503" y="626" width="560" height="58" rx="8" fill="#F2F6F9" stroke="#F2F6F9" stroke-width="2"/><text x="783" y="665" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="23" fill="#176A9B" font-weight="600" text-anchor="middle">干涉计量持续并行：运动 → 稳定 → AF → 曝光</text><rect x="70" y="741" width="1460" height="235" rx="14" fill="#FFF3E8" stroke="#F0D1B7" stroke-width="2"/><text x="96" y="790" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="37" fill="#C66C25" font-weight="700" text-anchor="start">150 + 100 + 30 = 280 ms</text><text x="96" y="837" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="26" fill="#17364B" font-weight="600" text-anchor="start">仅为执行AF帧已知串行三段的时间下限，不能解释为完整帧周期。</text><text x="96" y="883" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="22" fill="#5B6C78" font-weight="400" text-anchor="start">完整周期还须加入移动、未被包含的AF后恢复 / Measurement Ready等待、读出与控制等待。</text><text x="96" y="922" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="22" fill="#5B6C78" font-weight="400" text-anchor="start">AF是否逐FOV执行、失败重试及可重叠时间，须由冻结策略和本机时序记录确认。</text><text x="96" y="960" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="22" fill="#C66C25" font-weight="600" text-anchor="start">原AF方案约0.4–2.5 s/点，与100 ms分配待对账；280 ms不代表已实现周期。</text><line x1="70" y1="1008" x2="1530" y2="1008" stroke="#CBD6DE" stroke-width="2"/><text x="70" y="1044" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" font-size="18" fill="#5B6C78" font-weight="400" text-anchor="start">依据：技术基线 v1.0；原AF资料《对焦方案260911.pdf》第5页。时间为设计分配或方案核算值，非本机实测。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#315f86"/></marker><marker id="o" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#c77632"/></marker><marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#74899b"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12 L12 0" stroke="#dbe3e9" stroke-width="2"/></pattern></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, SimHei, sans-serif" fill="#263c50" stroke-linejoin="round" stroke-linecap="round"><text x="48" y="58" font-size="34" fill="#263c50" text-anchor="start" font-weight="600">图01  测量实体与图案坐标形成</text><text x="48" y="99" font-size="22" fill="#74899b" text-anchor="start" font-weight="400">图像局部定位与曝光工作点计量共同形成晶圆坐标；IPD由校正后坐标相对规定参考获得。</text><line x1="48" y1="124" x2="1552" y2="124" stroke="#dbe3e9" stroke-width="2"   /><text x="65" y="170" font-size="25" fill="#315f86" text-anchor="start" font-weight="600">a  镜头—晶圆相对测量实体（剖面示意）</text><rect x="92" y="206" width="697" height="35" rx="0" fill="#eaf0f5" stroke="#74899b" stroke-width="2" /><rect x="92" y="241" width="32" height="346" rx="0" fill="#eaf0f5" stroke="#74899b" stroke-width="2" /><text x="140" y="231" font-size="21" fill="#74899b" text-anchor="start" font-weight="400">计量参考结构</text><rect x="390" y="256" width="132" height="65" rx="0" fill="#eaf0f5" stroke="#315f86" stroke-width="2" /><text x="456" y="298" font-size="24" fill="#263c50" text-anchor="middle" font-weight="400">相机</text><rect x="418" y="321" width="76" height="94" rx="0" fill="white" stroke="#315f86" stroke-width="2" /><ellipse cx="456" cy="415" rx="38" ry="10" fill="#eaf0f5" stroke="#315f86" stroke-width="2"/>
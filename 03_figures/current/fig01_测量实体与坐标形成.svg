"499" font-size="21" fill="#263c50" text-anchor="start" font-weight="400">平面镜</text><polyline points="657,523 657,493 667,493" stroke="#74899b" stroke-width="2" fill="none"  /><rect x="146" y="486" width="89" height="60" rx="0" fill="white" stroke="#315f86" stroke-width="2" /><text x="190" y="511" font-size="18" fill="#315f86" text-anchor="middle" font-weight="400">干涉</text><text x="190" y="535" font-size="18" fill="#315f86" text-anchor="middle" font-weight="400">参考端</text><line x1="236" y1="510" x2="649" y2="538" stroke="#315f86" stroke-width="2" stroke-dasharray="8 5"  /><line x1="236" y1="521" x2="649" y2="550" stroke="#315f86" stroke-width="2" stroke-dasharray="8 5"  /><text x="265" y="489" font-size="20" fill="#315f86" text-anchor="start" font-weight="400">相对镜头参考端的连续位移计量</text><line x1="155" y1="623" x2="155" y2="570" stroke="#315f86" stroke-width="2"  marker-end="url(#a)" /><line x1="155" y1="623" x2="202" y2="623" stroke="#315f86" stroke-width="2"  marker-end="url(#a)" /><text x="132" y="562" font-size="20" fill="#263c50" text-anchor="start" font-weight="400">Z</text><text x="207" y="629" font-size="20" fill="#263c50" text-anchor="start" font-weight="400">X</text><text x="126" y="652" font-size="19" fill="#315f86" text-anchor="start" font-weight="400">计量系 M</text><text x="935" y="170" font-size="25" fill="#315f86" text-anchor="start" font-weight="600">b  同一曝光帧的局部定位与同步记录</text><rect x="971" y="207" width="452" height="285" rx="0" fill="white" stroke="#74899b" stroke-width="2" /><line x1="995" y1="217" x2="995" y2="480" stroke="#dbe3e9" stroke-width="1"   /><line x1="1023" y1="217" x2="1023" y2="480" stroke="#dbe3e9" stroke-width="1"   /><line x1="1051" y1="217" x2="1051" y2="480" stroke="#dbe3e9" stroke-width="1"   /><line x1="1079" y1="217" x2="1079" y2="480" stroke="#dbe3e9" stroke-width="1"   /><line x1="1107" y1="217" x2="1107" y2="480" stroke="#dbe3e9" stroke-width="1"   /><line x1="1135" y1="217" x2="1135" y2="480" stroke="#dbe3e9" stroke-width="1"   /><line x1="1163" y1="217" x2="1163" y2="480" stroke="#dbe3e9" stroke-width="1"   /><line x1="1191" y1="217" x2="1191" y2="480" stroke="#dbe3e9" stroke-width="1"   /><line x1="1219" y1="217" x2="1219" y2="480" stroke="#dbe3e9" stroke-width="1"   /><line x1="1247" y1="217" x2="1247" y2="480" stroke="#dbe3e9" stroke-width="1"   /><line x1="1275" y1="217" x2="1275" y2="480" stroke="#dbe3e9" stroke-width="1"   /><line x1="1303" y1="217" x2="1303" y2="480" stroke="#dbe3e9" stroke-width="1"   /><line x1="1331" y1="217" x2="1331" y2="480" stroke="#dbe3e9" stroke-width="1"   /><line x1="1359" y1="217" x2="1359" y2="480" stroke="#dbe3e9" stroke-width="1"   /><line x1="1387" y1="217" x2="1387" y2="480" stroke="#dbe3e9" stroke-width="1"   /><line x1="984" y1="217" x2="1412" y2="217" stroke="#dbe3e9" stroke-width="1"   /><line x1="984" y1="245" x2="1412" y2="245" stroke="#dbe3e9" stroke-width="1"   /><line x1="984" y1="273" x2="1412" y2="273" stroke="#dbe3e9" stroke-width="1"   /><line x1="984" y1="301" x2="1412" y2="301" stroke="#dbe3e9" stroke-width="1"   /><line x1="984" y1="329" x2="1412" y2="329" stroke="#dbe3e9" stroke-width="1"   /><line x1="984" y1="357" x2="1412" y2="357" stroke="#dbe3e9" stroke-width="1"   /><line x1="984" y1="385" x2="1412" y2="385" stroke="#dbe3e9" stroke-width="1"   /><line x1="984" y1="413" x2="1412" y2="413" stroke="#dbe3e9" stroke-width="1"   /><line x1="984" y1="441" x2="1412" y2="441" stroke="#dbe3e9" stroke-width="1"   /><line x1="984" y1="469" x2="1412" y2="469" stroke="#dbe3e9" stroke-width="1"   /><line x1="1159" y1="346" x2="1185" y2="346" stroke="#315f86" stroke-width="2.5"   /><line x1="1172" y1="333" x2="1172" y2="359" stroke="#315f86" stroke-width="2.5"   /><circle cx="1270" cy="292" r="15" fill="white" stroke="#c77632" stroke-width="3" /><circle cx="1270" cy="292" r="4" fill="#c77632" stroke="#c77632" stroke-width="2" /><line x1="1172" y1="346" x2="1257" y2="299" stroke="#c77632" stroke-width="3"  marker-end="url(#o)" /><text x="1142" y="377" font-size="24" fill="#315f86" text-anchor="start" font-weight="400">p₀</text><text x="1294" y="294" font-size="24" fill="#c77632" text-anchor="start" font-weight="400">pₖ</text><line x1="1011" y1="439" x2="1090" y2="439" stroke="#315f86" stroke-width="2"  marker-end="url(#a)" /><line x1="1011" y1="439" x2="1011" y2="375" stroke="#315f86" stroke-width="2"  marker-end="url(#a)" /><text x="1098" y="445" font-size="20" fill="#315f86" text-anchor="start" font-weight="400">u [pixel]</text><text x="1000" y="365" font-size="20" fill="#315f86" text-anchor="start" font-weight="400">v</text><text x="1195" y="465" font-size="23" fill="#c77632" text-anchor="middle" font-weight="400">像素偏移 Δpₖ</text><text x="953" y="540" font-size="23" fill="#263c50" text-anchor="start" font-weight="400">Cₖ：尺度、轴向 / 旋转与畸变标定</text><text x="953" y="579" font-size="23" fill="#263c50" text-anchor="start" font-weight="400">δrₖ = Cₖ(pₖ − p₀)  [统一长度单位]</text><line x1="1186" y1="493" x2="1186" y2="511" stroke="#c77632" stroke-width="2"  marker-end="url(#o)" /><rect x="947" y="619" width="535" height="104" rx="8" fill="#eaf0f5" stroke="#74899b" stroke-width="2" /><text x="970" y="656" font-size="22" fill="#315f86" text-anchor="start" font-weight="400">曝光门内按实际权重同步平均：</text><text x="970" y="694" font-size="22" fill="#315f86" text-anchor="start" font-weight="400">r̄_exp,k = ∫w(t)r_wp(t)dt / ∫w(t)dt</text><text x="65" y="773" font-size="25" fill="#315f86" text-anchor="start" font-weight="600">c  从同一计量系中的长度量，到最终状态 IPD</text><rect x="65" y="804" width="451" height="141" rx="6" fill="#eaf0f5" stroke="#315f86" stroke-width="2" /><text x="290" y="844" font-size="22" fill="#263c50" text-anchor="middle" font-weight="400">r_M,k = r̄_exp,k + δrₖ</text><text x="290" y="880" font-size="22" fill="#263c50" text-anchor="middle" font-weight="400">工作点坐标 + 标定后的物方位移</text><text x="290" y="916" font-size="22" fill="#263c50" text-anchor="middle" font-weight="400">两项采用同一坐标系与长度单位</text><line x1="517" y1="875" x2="559" y2="875" stroke="#315f86" stroke-width="2"  marker-end="url(#a)" /><rect x="563" y="804" width="275" height="141" rx="6" fill="white" stroke="#315f86" stroke-width="2" /><text x="700" y="844" font-size="21" fill="#263c50" text-anchor="middle" font-weight="400">晶圆坐标变换</text><text x="700" y="880" font-size="21" fill="#263c50" text-anchor="middle" font-weight="400">r_W,k = T_M→W(r_M,k)</text><text x="700" y="916" font-size="21" fill="#263c50" text-anchor="middle" font-weight="400">固定坐标、方向与参考</text><line x1="839" y1="875" x2="881" y2="875" stroke="#315f86" stroke-width="2"  marker-end="url(#a)" /><rect x="885" y="804" width="275" height="141" rx="6" fill="white" stroke="#315f86" stroke-width="2" /><text x="1023" y="843" font-size="21" fill="#263c50" text-anchor="middle" font-weight="400">系统校正 / 结果补偿</text><text x="1023" y="879" font-size="21" fill="#263c50" text-anchor="middle" font-weight="400">含 ESC 影响的 XY 映射</text><text x="1023" y="915" font-size="21" fill="#263c50" text-anchor="middle" font-weight="400">保留补偿后残余</text><line x1="1161" y1="875" x2="1203" y2="875" stroke="#315f86" stroke-width="2"  marker-end="url(#a)" /><rect x="1207" y="804" width="326" height="141" rx="6" fill="#fbf2e9" stroke="#c77632" stroke-width="2" /><text x="1370" y="843" font-size="21" fill="#263c50" text-anchor="middle" font-weight="400">最终状态 IPD</text><text x="1370" y="879" font-size="21" fill="#263c50" text-anchor="middle" font-weight="400">r_final,k − r_ref,k</text><text x="1370" y="915" font-size="21" fill="#263c50" text-anchor="middle" font-weight="400">参考网格与版本必须确定</text><text x="65" y="990" font-size="21" fill="#74899b" text-anchor="start" font-weight="400">读图边界：像素原值先映射成物方位移，不能直接与干涉位移相加；ESC 的 Z 向形貌须经模型映射至 XY 影响。</text><line x1="48" y1="1054" x2="1552" y2="1054" stroke="#dbe3e9" stroke-width="1.5"   /><text x="48" y="1089" font-size="19" fill="#74899b" text-anchor="start" font-weight="400">依据：技术基线 v1.0 §1C、§2；应用基线 §2–3。结构与位移均为原理示意，不代表实际尺寸或性能。</text></g></svg>
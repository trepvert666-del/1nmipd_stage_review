" stroke-width="2.5" /><line x1="1165" y1="560" x2="1191" y2="580" stroke="#c77632" stroke-width="2"  marker-end="url(#o)" /><line x1="1263" y1="560" x2="1317" y2="560" stroke="#dbe3e9" stroke-width="1"   /><line x1="1290" y1="533" x2="1290" y2="587" stroke="#dbe3e9" stroke-width="1"   /><rect x="1277" y="547" width="26" height="26" rx="0" fill="white" stroke="#315f86" stroke-width="2.5" /><circle cx="1336" cy="578" r="10" fill="white" stroke="#c77632" stroke-width="2.5" /><line x1="1290" y1="560" x2="1328" y2="578" stroke="#c77632" stroke-width="2"  marker-end="url(#o)" /><line x1="1388" y1="560" x2="1442" y2="560" stroke="#dbe3e9" stroke-width="1"   /><line x1="1415" y1="533" x2="1415" y2="587" stroke="#dbe3e9" stroke-width="1"   /><rect x="1402" y="547" width="26" height="26" rx="0" fill="white" stroke="#315f86" stroke-width="2.5" /><circle cx="1473" cy="576" r="10" fill="white" stroke="#c77632" stroke-width="2.5" /><line x1="1415" y1="560" x2="1465" y2="576" stroke="#c77632" stroke-width="2"  marker-end="url(#o)" /><text x="1305" y="644" font-size="25" fill="#263c50" text-anchor="middle" font-weight="600">O = O₀ + u_top − u_bottom</text><line x1="82" y1="693" x2="100" y2="693" stroke="#315f86" stroke-width="2"   /><line x1="91" y1="684" x2="91" y2="702" stroke="#315f86" stroke-width="2"   /><text x="112" y="700" font-size="20" fill="#315f86" text-anchor="start" font-weight="400">设计 / 理想 / Golden / 批次参考</text><circle cx="91" cy="734" r="6" fill="#c77632" stroke="#c77632" stroke-width="2" /><text x="112" y="741" font-size="20" fill="#c77632" text-anchor="start" font-weight="400">最终状态实测特征</text><text x="85" y="804" font-size="21" fill="#263c50" text-anchor="start" font-weight="400">只需在最终评价状态完成量测。</text><text x="85" y="843" font-size="21" fill="#263c50" text-anchor="start" font-weight="400">须明确参考、坐标建系及允许扣除项。</text><text x="85" y="882" font-size="21" fill="#263c50" text-anchor="start" font-weight="400">最终 IPD 不全部归因于 Bonding。</text><rect x="598" y="683" width="18" height="18" rx="0" fill="white" stroke="#315f86" stroke-width="2" /><text x="632" y="699" font-size="20" fill="#315f86" text-anchor="start" font-weight="400">Pre：同一组特征的前状态</text><circle cx="607" cy="734" r="6" fill="#c77632" stroke="#c77632" stroke-width="2" /><text x="632" y="741" font-size="20" fill="#c77632" text-anchor="start" font-weight="400">Post：对应特征的后状态</text><text x="590" y="804" font-size="21" fill="#263c50" text-anchor="start" font-weight="400">必须匹配图案并统一坐标与版本。</text><text x="590" y="843" font-size="21" fill="#263c50" text-anchor="start" font-weight="400">观测增量仍含装夹、温度和量测差。</text><text x="590" y="882" font-size="21" fill="#263c50" text-anchor="start" font-weight="400">不是获得最终状态 IPD 的必要条件。</text><rect x="1101" y="684" width="22" height="22" rx="0" fill="white" stroke="#315f86" stroke-width="2.5" /><text x="1140" y="701" font-size="20" fill="#315f86" text-anchor="start" font-weight="400">底片对应特征</text><circle cx="1112" cy="739" r="10" fill="white" stroke="#c77632" stroke-width="2.5" /><text x="1140" y="745" font-size="20" fill="#c77632" text-anchor="start" font-weight="400">顶片对应特征</text><text x="1094" y="804" font-size="21" fill="#263c50" text-anchor="start" font-weight="400">O₀：初始对准误差；u：面内位移。</text><text x="1094" y="843" font-size="21" fill="#263c50" text-anchor="start" font-weight="400">需要上下两片及其装配关系。</text><text x="1094" y="882" font-size="21" fill="#263c50" text-anchor="start" font-weight="400">Top IPD 不能直接替代 Overlay。</text><line x1="48" y1="1004" x2="1552" y2="1004" stroke="#dbe3e9" stroke-width="1.5"   /><text x="48" y="1039" font-size="19" fill="#74899b" text-anchor="start" font-weight="400">依据：IPD与Bonding应用基线 §2–5；写作基线 §4.2–4.4。箭头仅用于解释参照关系，不表示数值、比例或设备可见性。</text></g></svg>